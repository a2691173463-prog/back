server:
  port: 8080

spring:
  application:
    name: back
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 105MB
  config:
    import:
      # Support running from either the back directory or the repository root.
      - optional:file:./.env[.properties]
      - optional:file:./back/.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:3306/interview_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: localhost
    port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    connection-timeout: 5s
    requested-heartbeat: 30s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        concurrency: 1
        max-concurrency: 1
        prefetch: 3
        default-requeue-rejected: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

ai:
  # Java handles business orchestration; model requests are delegated to Python.
  python-agent:
    base-url: http://localhost:8000
    timeout-seconds: 120
  internal-secret: ${AI_INTERNAL_SECRET:local-agent-secret-change-me}

mq:
  resume:
    publisher-max-attempts: 3
    confirm-timeout-seconds: 5
    outbox-max-attempts: 10
    outbox-dispatch-enabled: true
    outbox-scan-interval-ms: 10000
    outbox-initial-delay-ms: 10000
